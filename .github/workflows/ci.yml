name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:format
      - name: Explain failure
        if: failure()
        run: echo "::error title=Lint failed::Run 'npm run lint' locally. For formatting errors run 'npm run format' and commit the result. Do not disable rules to pass."

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Explain failure
        if: failure()
        run: echo "::error title=Unit tests failed::Run 'npm run test:unit' locally. Tests cover the build helpers, the markdown sanitizer (XSS) and the link checker."

  build:
    name: Build, HTML validation, internal links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:html
      - run: npm run links:internal
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7
      # The Pages artifact is uploaded here, minutes before the deploy job reads it. Uploading it inside the deploy
      # job raced GitHub's artifact API ("No artifacts named github-pages"), and re-running that job then produced a
      # duplicate ("Multiple artifacts named github-pages"). Uploading once, early, avoids both.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Explain failure
        if: failure()
        run: echo "::error title=Build check failed::Run 'npm run build && npm run validate:html && npm run links:internal' locally. Missing writeups means 'git submodule update --init'."

  external-links:
    name: External links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 404/410 fail. Timeouts, 403, 429 and 5xx are retried 3 times and then reported as warnings only.
      - run: node scripts/check-links.mjs --external
      - name: Explain failure
        if: failure()
        run: echo "::error title=Dead external link::An external URL returned 404/410. Update or remove the link listed above."

  e2e:
    name: Playwright and axe
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Explain failure
        if: failure()
        run: echo "::error title=E2E tests failed::Download the playwright-report artifact, or run 'npm run build && npm run test:e2e' locally."

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: _site
      # Pages are served from _site by LHCI's local static server and use no third-party requests,
      # so scores depend only on this repository. Thresholds live in lighthouserc.json.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
      - name: Explain failure
        if: failure()
        run: echo "::error title=Lighthouse below threshold::Open the lighthouse-reports artifact to see failing audits. Fix the cause; do not lower thresholds in lighthouserc.json."

  deploy:
    name: Deploy to GitHub Pages
    # Runs on pushes to main, and on a manual "Run workflow" from main to redeploy without a new commit.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, unit, build, external-links, e2e, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
