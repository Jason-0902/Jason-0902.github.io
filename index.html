<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Lin - 開發者 & CTF 玩家</title>
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">

    <header class="top-header">
        <a href="#home" class="nav-link logo">Jason's Blog</a>
        <nav class="navigation">
            <a href="#home" class="nav-link active">Home</a>
            <a href="#blog" class="nav-link">Blog</a>
            <a href="#cv" class="nav-link">CV</a>
            <button id="dark-toggle">🌙</button>
        </nav>
    </header>

    <main class="content">
        <section id="home" class="view active">
            <div class="hero-content">
                <h1>jason.io</h1>
                <div id="typewriter-container">
                    <span id="typewriter"></span><span class="cursor">|</span>
                </div>
            </div>
        </section>

        <section id="blog" class="view">
            <h2>Blog Posts</h2>
            <div id="blog-list">
                </div>
        </section>
        
        <section id="cv" class="view">
            <h2>Curriculum Vitae</h2>
            <div class="cv-content">
                <p>==</p>
                <h3>技能</h3>
                <ul>
                    <li>Rust, Python, C/C++</li>
                    <li>Reverse Engineering, System Programming</li>
                    <li>Git, Docker</li>
                </ul>
            </div>
        </section>

        <section id="blog-post" class="view">
            <button id="back-to-blog">&larr; 返回列表</button>
            <h2 id="post-title"></h2>
            <p id="post-meta"></p>
            <hr>
            <div id="post-content">
                </div>
        </section>
    </main>

    <footer class="social-footer">
        <a href="https://github.com/jason-0902" target="_blank" title="GitHub">
            GH
        </a>
        </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
