<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Lin - 開發者 & CTF 玩家</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">

    <div class="background-gradient"></div>

    <div class="main-container">
        <aside class="sidebar">
            <div class="profile">
                <img src="assets/profile.jpg" alt="Profile Picture" class="profile-pic">
                <h1>Jason Lin</h1>
                <p>Developer & Student</p>
            </div>
            <nav class="navigation">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#blog" class="nav-link">Blog</a>
                <a href="#cv" class="nav-link">CV</a>
            </nav>
            <div class="sidebar-footer">
                <button id="dark-toggle">☀️</button>
                <div class="social-links">
                    <a href="https://github.com/jason-0902" target="_blank">GitHub</a>
                </div>
            </div>
        </aside>

        <main class="content">
            <section id="home" class="view active">
                <div class="home-content">
                    <h2>你好，我是 Jason</h2>
                    <div id="typewriter-container">
                        <span id="typewriter"></span><span class="cursor">|</span>
                    </div>
                </div>
            </section>

            <section id="blog" class="view">
                <h2>Blog Posts</h2>
                <div id="blog-list">
                    </div>
            </section>
            
            <section id="cv" class="view">
                <h2>Curriculum Vitae</h2>
                <div class="cv-content">
                    <p>你可以在這裡嵌入你的 PDF 履歷，或直接用 HTML 撰寫。</p>
                    <a href="#" class="button">下載 PDF 履歷</a>
                    </div>
            </section>

            <section id="blog-post" class="view">
                <button id="back-to-blog">&larr; 返回列表</button>
                <h2 id="post-title"></h2>
                <p id="post-meta"></p>
                <hr>
                <div id="post-content">
                    </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
