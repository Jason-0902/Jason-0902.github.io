<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" />
    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : light ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="{{cssHref}}" />
    <script src="{{jsHref}}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">JL</span>Jason Liu</a>
        <nav class="site-nav" aria-label="Primary">{{nav}}</nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
          <span aria-hidden="true" class="theme-icon"></span>
        </button>
      </div>
    </header>
    <main id="main" class="container">{{content}}</main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; {{year}} Tsung-Yen (Jason) Liu &middot; Taiwan</p>
        <p class="footer-links">
          <a href="https://github.com/Jason-0902">GitHub</a>
          <a href="mailto:jasons.tud48@gmail.com">Email</a>
        </p>
      </div>
    </footer>
  </body>
</html>
